# A3（优化清单第 41 项）：CDP 运行时套件的可选手动门。
#
# **已证明：首次跑绿是 run 38776535438**（2026-10-16，开发机自托管 runner CHEN，套件 verify + verify:agent）。
# 后续（2026-10-16，runner chen_work）：verify:game 15/0 是 run 38832007396；
# 更早的 verify:agent 77/0 是 run 38832924368，跑的时候 Qoder 一直在调工具，证明 PET_AGENT_INBOX 隔离生效。
# 断言下限、允许的 skip、环境豁免的唯一来源是 [.github/workflows/e2e-gate.json](e2e-gate.json)（离线用
# `npm run check:e2e-gate` 核对）。读数和下限只许出现在那一个文件里 —— 以前这里和 gate 各写一份，
# 同一提交因此出现 verify:agent 303/4 与 307/0 两个「基线」（复核报告 N4）。
# 门怎么判：每个套件必须在末尾打出 `E2E-SUMMARY suite=<脚本名> passed=N failed=N skipped=N`
# （tests/e2e/harness/cdp.mjs 的 report.summary() 负责），且断言数 ≥ 下限、failed=0、退出码=0、
# 每条 skip 都登记在 allowedSkips 里且未过期，才给 GREEN。未登记的 skip 一律 SKIP-RED ——
# 不再靠整份日志里搜「跳过」，那条判据会被普通中文文案和「不配 Key 就跑不了的在线组」误伤
# （报告 N2 / G1-05；verify:pet-drag 的分组标题、verify:goat-gauge 的在线组就是这么被判红的）。
# 旧文里「verify:agent 当期基线 148/0」是 A02 时期的读数，早被后面的组数顶过去了，别再拿它对账。
#
# 托管 runner 已证否（run 38757735230，2026-10-15，windows-latest）：编译、起 dev 实例都过，
# 之后每个进程（含 node 与 actions 的 post 步）都以 -1073741502 = 0xC0000142（DLL 初始化失败）退出，
# 套件一条没跑。托管 runner 的服务会话撑不起 WebView2 窗口，所以这条门改跑在开发机的自托管 runner 上。
#
# 自托管 runner 的约束（别图省事改掉）：
#   - 标签 `desktop-pet-e2e` 只给这一条工作流用；ci.yml 留在托管 runner，PR（含 fork）不会落到开发机。
#   - runner 必须**以交互方式**跑（在已登录的桌面里 `run.cmd`），不要装成 Windows 服务 ——
#     服务跑在 session 0，没有可见桌面，会原样复现上面那个 0xC0000142。
#   - 开工前自己的宠物实例要先退掉：单实例锁 + CDP 9223 撞上就是「预检」那一步直接判红。
#   - 跑的时候别在 Qoder 里干活（见下面 verify:agent 那条坑），否则 71/6 那种红不算数。
#
# 与 ci.yml 的分工（口径抄自 CONVENTIONS）：
#   - ci.yml 只跑零 GUI、零联网的部分，是每次 push/PR 必须绿的门；
#   - 这里的每一步都要真实 webview 与桌面会话（CDP 9223 + 单实例锁 + 会起窗口），默认不自动跑。
#
# 本机已跑过的等价复演（2026-10-15，Windows 开发机，按本文件的步骤顺序）：
#   起 `npm run dev:debug`（带 PET_AGENT_CONFIG_FILES）→ `node tools/wait-cdp.mjs` 就绪（READY，退 0；
#   对着空端口跑则 TIMEOUT，退 1 —— 两支都实测过）→ `npm run verify` **270/0** → `npm run verify:agent` **77/0**。
# 那一段证的是「步骤与 env 的形状对得上」。**runner 本身当时是未知项，现已有答案**：
# 托管 windows-latest 起不来 WebView2（0xC0000142，见上面那段），改跑开发机自托管 runner 才真跑绿
# （run 38776535438，verify + verify:agent）。所以这段复演的价值只剩「本地手动复现时的步骤顺序」。
#
# 下面这条坑已用 PET_AGENT_INBOX 隔离（job env 里设了，实例与套件读同一个 temp 目录）；留着原文是给本机不带
# 这个变量手动复演的人看的。
# 一条开发机才有的坑（自托管后 runner 就是开发机，所以这条现在会犯，写在这是为了让看到红的人别误判）：
# `verify:agent` 的「本轮会话状态」那组对**并发 agent 会话**敏感。同一台开发机上装了全局 Qoder hook，
# 主会话每调一次工具就往宿主共享的 inbox 写一条（`PET_AGENT_CONFIG_FILES` 只重定向 hook 配置文件，
# **不重定向 inbox**）。边跑这套件边在会话里干活 → 实测 71/6 红；什么都不等它跑完 → 77/0。
# 判据是同环境重跑两次，不是改判据。
#
# 不在默认清单里的套件与原因（别顺手加进 default）：
#   verify:game    全屏置顶窗 + 定时器，桌面堆（desktop heap）风险；已进白名单，但只在手动点名时跑，不进默认清单；
#   verify:release 自己起 release exe 并占 9224，还要 3~4 分钟 tauri build；
#   verify:astock / verify:http / verify:skin 出网（行情、GBK 源、petdex.dev），数据形态随时段漂。
#
# 假绿门禁（G1-05 / G1-06，2026-10-28 加；配置在同目录 e2e-gate.json，2026-10-29 重写为 v2）：
#   - **结构化 skip**：harness 的 `report.skip(label, reason)` 把跳过打成分级日志里的 `SKIP <label>`
#     行，门只认这些行（不再整份日志搜「跳过」）。每条 skip 必须登记在 allowedSkips（含理由与到期日），
#     否则 SKIP-RED。前置不满足仍然要抛错判红：skip 不是「前置缺失」的替代品。
#   - **断言数下限**：minAssertions 钉每个套件的下限，低于下限判红；还没量过基线的套件写进
#     floorPending（extended 模式），既不算绿也不假装有下限。
#   - **known-env-failures**：环境债登记在 knownEnvFailures（suite + 失败项子串 + 到期日 + 理由）。
#     命中时在 step summary 里单列 ENV-RED 并打 warning，但**整体仍然判红**：白名单只用来区分
#     「环境债」与「回归」，不允许把红灯洗成绿灯。当前登记为空 —— verify 的两条历史条目在 CI 里
#     本来就不会触发（GITHUB_ACTIONS 已经走 preseed，PET_HOTKEY_DEFAULT 也已在 job env 里设），
#     留着只会让「缺夹具就别豁免」这句话自相矛盾（N5）。
name: E2E（手动触发）

# 这份门只需要读代码：不写任何状态、不发评论、不动包
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      suites:
        description: "要跑的套件，逗号分隔，名字照 package.json 里的 npm script"
        required: false
        default: "verify,verify:agent"
      mode:
        description: "模式：core（默认，8 个离线套件）或 extended（另需打包产物/外网，见 e2e-gate.json 的 modes）"
        required: false
        default: "core"
  # 给 e2e-extended.yml 复用同一套步骤与同一份 gate 配置，避免第二份判据漂移
  workflow_call:
    inputs:
      suites:
        required: false
        type: string
        default: "verify:skin,verify:astock,verify:http,verify:release"
      mode:
        required: false
        type: string
        default: "extended"

concurrency:
  # 单实例锁 + 固定 CDP 端口：同一 ref 上并跑两个 e2e 只会互相抢 9223
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cdp:
    # 只跑在开发机的自托管 runner 上（约束见文件头）
    runs-on: [self-hosted, Windows, desktop-pet-e2e]
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: always
      # 套件与等待脚本都读这一个端口；固定值，不暴露成输入 —— 端口一漂，红的就不是被测行为
      CDP_PORT: "9223"
      # verify:agent 的写盘组只碰这两份样例：路径不在仓库根下时那组会整组跳过，
      # 而守卫「目标文件都在 temp/ 下」当场判红（这是设计，不是缺陷）
      PET_AGENT_CONFIG_FILES: ${{ github.workspace }}\temp\a9a\cfg-a.json;${{ github.workspace }}\temp\a9a\cfg-b.json
      # 收件目录也隔离：开发机的全局 Qoder hook 照旧写 APPDATA 下的默认 inbox，实例与套件读这一份
      PET_AGENT_INBOX: ${{ github.workspace }}\temp\agent-inbox
      # PET_AGENT_HOME 覆盖 ZCode/Codex/WorkBuddy 的 home 根（适配器在它下面找 .zcode 等目录），
      # Qoder 不受它影响、继续走 PET_AGENT_CONFIG_FILES。夹具目录由 verify-agent-bridge.mjs
      # 自己建自己删，本工作流不负责预置。
      PET_AGENT_HOME: ${{ github.workspace }}\temp\agent-home
      # A31：热键 settings.json 只允许 debug 构建用 PET_SETTINGS_DIR 重定向；实例与套件读同一个目录。
      # release 不读这个变量（hotkeys.rs 里由 cfg!(debug_assertions) 编译期裁掉）。
      PET_SETTINGS_DIR: ${{ github.workspace }}\temp\settings-e2e
      # E02：E2E 机器的默认键 Ctrl+Alt+P 被占且无法释放；debug 构建改用空闲的默认键，
      # 让「默认值本身必须能设」「改回默认值」两条判据真正跑起来。release 不读这个变量。
      PET_HOTKEY_DEFAULT: "CommandOrControl+Alt+Q"
      # N7：verify:dsh 的前置是 PET_DSH_HOME，缺了它套件按设计 exit 2（前置缺失必须是红，不能静默跳过）。
      # 以前只有本地 tools/e2e-run.mjs 设过它，所以这条门里的 verify:dsh 必红；这里补上同一口径的临时 home。
      PET_DSH_HOME: ${{ github.workspace }}\temp\dsh-home-e2e

    steps:
      - uses: actions/checkout@v4
        with:
          # 留着 src-tauri/target，不然每次都要从头编 debug
          clean: false

      # 上一轮套件中途崩溃时，plugins/ 里的探针插件（zz.probe / zz.net / com.zz.spoof 等）
      # 不会被清掉；checkout 又是 clean:false，下一轮 `npm run build` 里的
      # `tsc -p tsconfig.plugins.json` 会把它们当源码检查而在 40 秒内判红，
      # 不论是哪个分支触发的（run 39111941677）。所以构建之前先清一遍。
      # run 块里只许 ASCII（见下面 Windows PowerShell 5.1 的说明）。
      - name: 清理上一轮残留的探针插件
        shell: powershell
        run: |
          Get-ChildItem -Path plugins -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "zz.*" -or $_.Name -like "com.zz.*" } | ForEach-Object { Write-Host "Removing stale fixture plugin: $($_.Name)"; Remove-Item -LiteralPath $_.FullName -Recurse -Force }

      - name: 装 Rust 工具链（rust-toolchain.toml 钉 1.98.1）
        run: |
          rustup set profile minimal
          rustup show

      # 自托管 = 开发机：不用 setup-node / actions/cache。两者都要从 GitHub 拉东西，开发机网络上
      # 实测 setup-node 卡了 20 分钟（run 38759736236）；机器本身就有 Node 和 cargo 缓存，直接用。
      # 只校验大版本，理由见 ci.yml 里那段 node 22 的教训
      # Windows PowerShell 5.1 读没有 BOM 的临时脚本按系统 ANSI（GBK）解码：run 块里只许 ASCII，
      # 中文写在 YAML 注释里（run 38773272057 预检步被中文 throw 字符串弄成解析错误）
      - name: 校验本机 Node 大版本（要求 24）
        shell: powershell
        run: |
          $v = (node --version)
          Write-Host "node $v / npm $(npm --version)"
          if (-not $v.StartsWith("v24.")) { throw "Dev machine Node is $v; this gate requires 24.x" }

      - name: 安装前端依赖
        run: npm ci

      # 把编译时间挡在「就绪等待」之外：不预编的话，dev 首次编译会落进 wait-cdp 的窗口里，
      # 那种超时红看着像「webview 起不来」，其实根本没轮到它
      - name: 预编 debug 二进制（顺带证明这条链路能编出来）
        run: npx tauri build --debug --no-bundle

      # 自托管 = 开发机：用户自己的宠物实例或上一轮残留会占单实例锁和 9223，
      # 不先挡掉的话红在 wait-cdp 或套件中途，看着像被测行为坏了
      - name: 预检（9223 空闲、没有在跑的宠物实例）
        shell: powershell
        run: |
          $busy = Get-NetTCPConnection -LocalPort ${{ env.CDP_PORT }} -State Listen -ErrorAction SilentlyContinue
          if ($busy) { throw "Port ${{ env.CDP_PORT }} is held by PID $($busy.OwningProcess -join ','): quit the local pet / debug instance, then re-run" }
          $pet = Get-Process -Name "desktop-pet" -ErrorAction SilentlyContinue
          if ($pet) { throw "desktop-pet is already running (PID $($pet.Id -join ',')): the single-instance lock would make the dev instance exit; quit it, then re-run" }

      # 不能用 Start-Process -NoNewWindow + -Redirect*：在 runner 里那样起，tauri dev 跑完 BeforeDevCommand
      # 就停住，连 cargo run 都不进（run 38773601446，dev.err 停在 Running BeforeDevCommand；同一份 env
      # 在交互终端里手动起一切正常）。改成给它一个真控制台窗口（最小化），重定向交给 cmd 做。
      - name: 起 dev 实例（Vite + WebView2 远程调试端口）
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path temp | Out-Null
          $dev = Start-Process -FilePath "cmd.exe" `
            -ArgumentList "/d", "/c", "npm run dev:debug > temp\dev.log 2> temp\dev.err" `
            -WindowStyle Minimized -PassThru
          $dev.Id | Out-File -FilePath "temp/dev.pid" -Encoding ascii
          Write-Host "dev:debug wrapper PID $($dev.Id)"

      - name: 等宠物页在 CDP 上可见
        run: node tools/wait-cdp.mjs --port=${{ env.CDP_PORT }} --timeout=900

      - name: 跑 CDP 运行时套件
        shell: powershell
        env:
          SUITES: ${{ inputs.suites }}
          MODE: ${{ inputs.mode }}
        run: |
          # Suite list, assertion floors, allowed skips and the expiry registry all live in
          # .github/workflows/e2e-gate.json (checked offline by `npm run check:e2e-gate`). This step
          # only applies them; it must never re-state a reading of its own (report N4).
          # G1-09 / t39: verify:drag and verify:dsh are in core mode - leaving them out left the drag
          # fix and the DSH bridge with no automatic entry point, and a floor outside the list is prose.
          $configPath = ".github/workflows/e2e-gate.json"
          if (-not (Test-Path $configPath)) {
            throw "Missing $configPath - the E2E gate needs assertion floors and a skip registry"
          }
          $config = [System.IO.File]::ReadAllText((Resolve-Path $configPath).Path, [System.Text.Encoding]::UTF8) | ConvertFrom-Json
          $mode = if ($env:MODE) { $env:MODE } else { "core" }
          $modeProp = $config.modes.PSObject.Properties[$mode]
          if (-not $modeProp) {
            $known = ($config.modes.PSObject.Properties | ForEach-Object { $_.Name }) -join ", "
            throw "Unknown E2E mode '$mode' in $configPath (configured: $known)"
          }
          $allowed = @($modeProp.Value)
          $floor = @{}
          foreach ($p in $config.minAssertions.PSObject.Properties) { $floor[$p.Name] = [int]$p.Value }
          $pendingFloors = @{}
          if ($config.floorPending) { foreach ($p in $config.floorPending.PSObject.Properties) { $pendingFloors[$p.Name] = [string]$p.Value } }
          foreach ($a in $allowed) {
            if (-not $floor.ContainsKey($a) -and -not $pendingFloors.ContainsKey($a)) {
              throw "Suite $a has neither minAssertions nor floorPending in $configPath"
            }
          }
          # Registered skips: a skip is only tolerated when its label matches an entry that has a
          # reason and has not expired. Everything else is SKIP-RED. The old gate grepped the whole log
          # for the word for 'skip' in Chinese and turned two allowlisted suites permanently red
          # (report N2 / G1-05: a group title and an online group that needs an API key).
          $skipRules = @()
          if ($config.allowedSkips) {
            foreach ($s in $config.allowedSkips) {
              $skipRules += [pscustomobject]@{ Suite = [string]$s.suite; Match = [string]$s.match; Reason = [string]$s.reason; Expires = [string]$s.expires }
            }
          }
          $rules = @()
          if ($config.knownEnvFailures) {
            foreach ($k in $config.knownEnvFailures) {
              $rules += [pscustomobject]@{ Suite = [string]$k.suite; Match = [string]$k.match; Reason = [string]$k.reason; Expires = [string]$k.expires }
            }
          }
          $today = (Get-Date).ToString("yyyy-MM-dd")
          $requested = @()
          foreach ($s in ($env:SUITES -split ",")) { if ($s.Trim()) { $requested += $s.Trim() } }
          if ($requested.Count -eq 0) { throw "No suites requested (inputs.suites is empty)" }

          New-Item -ItemType Directory -Force -Path temp | Out-Null
          $failed = @()
          $debt = @()
          $rows = @()

          foreach ($name in $requested) {
            if ($allowed -notcontains $name) {
              throw "Suite $name is not in mode '$mode' of $configPath (allowed: $($allowed -join ', '))"
            }
            $slug = $name -replace ":", "-"
            $logWin = "temp\suite-$slug.log"
            $logFull = Join-Path (Get-Location).Path $logWin

            Write-Host ""
            Write-Host "===== npm run $name ====="
            # Capture first, then replay, so the log can be scanned for the structured summary, SKIP
            # lines and FAIL labels. Live streaming is not worth losing that.
            cmd /c "npm run $name > $logWin 2>&1"
            $code = $LASTEXITCODE
            $text = ""
            if (Test-Path $logFull) { $text = [System.IO.File]::ReadAllText($logFull, [System.Text.Encoding]::UTF8) }
            Write-Host $text

            # report.summary() ends every suite with exactly one machine line:
            #   E2E-SUMMARY suite=<npm script> passed=<n> failed=<n> skipped=<n>
            # Matching by suite id means a nested or replayed run can never be mistaken for this one
            # ("the last N passed, M failed in the log" could be, e.g. a crash restarted suite).
            $summary = $null
            foreach ($m in [regex]::Matches($text, "(?m)^E2E-SUMMARY suite=(\S+) passed=(\d+) failed=(\d+) skipped=(\d+)\s*$")) {
              if ($m.Groups[1].Value -eq $name) { $summary = $m }
            }
            $passed = 0
            $assertFailed = 0
            $summarySkip = 0
            $hasSummary = $false
            if ($summary) {
              $hasSummary = $true
              $passed = [int]$summary.Groups[2].Value
              $assertFailed = [int]$summary.Groups[3].Value
              $summarySkip = [int]$summary.Groups[4].Value
            }
            $assertions = $passed + $assertFailed

            # Structured skips only, in the shape r.skip() prints: "  SKIP <label> - <reason>".
            $skipLabels = @()
            foreach ($sm in [regex]::Matches($text, "(?m)^\s*SKIP\s+(.+?)\s*$")) { $skipLabels += $sm.Groups[1].Value }
            $registeredSkips = 0
            $badSkips = @()
            foreach ($label in $skipLabels) {
              $hit = $null
              foreach ($rule in $skipRules) {
                if ($rule.Suite -ne $name) { continue }
                if (-not $rule.Reason) { continue }
                if ($rule.Match -and -not $label.Contains($rule.Match)) { continue }
                if ($rule.Expires -and ([string]::CompareOrdinal($rule.Expires, $today) -lt 0)) { continue }
                $hit = $rule
                break
              }
              if ($hit) { $registeredSkips++ } else { $badSkips += $label }
            }

            $failLines = @()
            foreach ($fm in [regex]::Matches($text, "(?m)^\s+FAIL\s+(.*)$")) { $failLines += $fm.Groups[1].Value.Trim() }

            $reasons = @()
            if (-not $hasSummary) { $reasons += "no E2E-SUMMARY line for suite=$name (every suite must end through report.summary())" }
            if ($code -ne 0) { $reasons += "exit=$code" }
            if ($assertFailed -ne 0) { $reasons += "failed=$assertFailed" }
            if ($hasSummary -and $summarySkip -ne $skipLabels.Count) {
              $reasons += "summary reports skipped=$summarySkip but $($skipLabels.Count) SKIP lines were logged"
            }
            if ($badSkips.Count -gt 0) { $reasons += "unregistered skips: " + ($badSkips -join " | ") }
            if ($floor.ContainsKey($name) -and $assertions -lt $floor[$name]) {
              $reasons += "assertions=$assertions below floor=$($floor[$name])"
            }

            $debtHits = @()
            $regressions = @()
            foreach ($line in $failLines) {
              $hit = $null
              foreach ($rule in $rules) {
                if ($rule.Suite -ne $name) { continue }
                if ($rule.Match -and -not $line.Contains($rule.Match)) { continue }
                if ($rule.Expires -and ([string]::CompareOrdinal($rule.Expires, $today) -lt 0)) { continue }
                $hit = $rule
                break
              }
              if ($hit) { $debtHits += ("{0} [{1}]" -f $line, $hit.Reason) } else { $regressions += $line }
            }
            if ($failLines.Count -eq 0) {
              # A crash (e.g. a preseed guard throwing) has no FAIL label to match, so fall back to the log
              # text: a registered env cause is then still separable from a real regression - and still red.
              foreach ($rule in $rules) {
                if ($rule.Suite -ne $name) { continue }
                if ($rule.Match -and -not $text.Contains($rule.Match)) { continue }
                if ($rule.Expires -and ([string]::CompareOrdinal($rule.Expires, $today) -lt 0)) { continue }
                $debtHits += ("log matched '{0}' [{1}]" -f $rule.Match, $rule.Reason)
                break
              }
            }

            $verdict = "GREEN"
            if ($reasons.Count -gt 0) {
              if ($badSkips.Count -gt 0) { $verdict = "SKIP-RED" }
              elseif ($regressions.Count -gt 0) { $verdict = "REGRESSION-RED" }
              elseif ($debtHits.Count -gt 0) { $verdict = "ENV-RED" }
              elseif (-not $hasSummary) { $verdict = "NO-SUMMARY-RED" }
              else { $verdict = "FLOOR-RED" }
            }

            $floorText = "-"
            if ($floor.ContainsKey($name)) { $floorText = [string]$floor[$name] }
            elseif ($pendingFloors.ContainsKey($name)) { $floorText = "pending" }
            $rows += [pscustomobject]@{ Suite = $name; Passed = $passed; Failed = $assertFailed; Skipped = $skipLabels.Count; Registered = $registeredSkips; Assertions = $assertions; Floor = $floorText; Verdict = $verdict }
            if ($verdict -eq "GREEN") {
              Write-Host ("VERDICT GREEN: {0} ({1} assertions, floor {2}, {3} registered skips)" -f $name, $assertions, $floorText, $registeredSkips)
            } else {
              $failed += $name
              Write-Host ("VERDICT {0}: {1} | {2}" -f $verdict, $name, ($reasons -join "; "))
              foreach ($d in $debtHits) {
                $debt += ("{0}: {1}" -f $name, $d)
                Write-Host ("::warning title=E2E env debt, still red::{0} | {1}" -f $name, $d)
              }
              foreach ($g in $regressions) {
                Write-Host ("::error title=E2E regression::{0} | {1}" -f $name, $g)
              }
            }
          }

          # Summary: one table for every requested suite plus a separate list for registered env debt,
          # so a red run is triaged without opening the job log (which is 403 for anonymous readers).
          $md = @()
          $md += "### E2E gate ($mode mode)"
          $md += ""
          $md += "| suite | passed | failed | skipped | registered skips | assertions | floor | verdict |"
          $md += "| --- | --- | --- | --- | --- | --- | --- | --- |"
          foreach ($r in $rows) {
            $md += ("| {0} | {1} | {2} | {3} | {4} | {5} | {6} | {7} |" -f $r.Suite, $r.Passed, $r.Failed, $r.Skipped, $r.Registered, $r.Assertions, $r.Floor, $r.Verdict)
          }
          if ($debt.Count -gt 0) {
            $md += ""
            $md += "Known environment debt (registered in e2e-gate.json, NOT counted as green):"
            foreach ($d in $debt) { $md += "- $d" }
          }
          if ($failed.Count -gt 0) {
            $md += ""
            $md += "Result: RED (not green: $($failed -join ', ')) - green requires a structured summary, zero failures, every suite at or above its floor, and no unregistered skips"
          } else {
            $md += ""
            $md += "Result: GREEN (every suite printed its summary, at or above its floor, no unregistered skips)"
          }
          if ($env:GITHUB_STEP_SUMMARY) { $md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append }
          foreach ($lineOut in $md) { Write-Host $lineOut }

          if ($failed.Count -gt 0) {
            $msg = "E2E suites not green ($mode mode): " + ($failed -join ", ")
            if ($debt.Count -gt 0) { $msg += ". Registered env debt (still red; needs a waiver with an expiry in the PR): " + ($debt -join " ; ") }
            throw $msg
          }

      - name: 失败时把 dev 实例的日志打成 artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-log
          path: |
            temp/dev.log
            temp/dev.err
          if-no-files-found: ignore

      # 只按本次起的进程树收：taskkill /PID 是从 temp/dev.pid 读回来的那个，
      # 不按映像名一刀切（/IM 会把别人起的同一份 exe 一起带走，这是硬规矩）
      - name: 收尾关实例
        if: always()
        shell: powershell
        run: |
          if (Test-Path "temp/dev.pid") {
            $pid0 = (Get-Content "temp/dev.pid" -Raw).Trim()
            if ($pid0) { taskkill /PID $pid0 /T /F 2>&1 | Out-Null }
          }
          Get-CimInstance Win32_Process -Filter "Name='desktop-pet.exe'" |
            Where-Object { $_.ExecutablePath -like "$env:GITHUB_WORKSPACE*" } |
            ForEach-Object { Write-Host "Killing leftover PID $($_.ProcessId)"; Stop-Process -Id $_.ProcessId -Force }

      # 收尾再清一次：本轮崩溃留下的探针插件不要留给下一个分支
      - name: 收尾清理探针插件
        if: always()
        shell: powershell
        run: |
          Get-ChildItem -Path plugins -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "zz.*" -or $_.Name -like "com.zz.*" } | ForEach-Object { Remove-Item -LiteralPath $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }
