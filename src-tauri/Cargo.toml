[package]
name = "desktop-pet"
version = "0.2.0"
description = "Plugin-driven Windows desktop pet"
# 与仓库归属一致公开身份（GitHub 账号），原先的 "DesktopPet" 是占位串，
# 会原样进二进制的元数据
authors = ["beichenhaoyu"]
edition = "2021"

[lib]
# `_lib` 后缀避免 Windows 上 lib 名与 bin 名冲突，见 https://github.com/rust-lang/cargo/issues/8519
# 只做 Windows 桌面，staticlib/cdylib 是给移动目标准备的 —— 留着每次构建都多编两遍产物
name = "desktop_pet_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
log = "0.4"
ureq = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order 是 crate 全局生效，不只给 ZCode：serde_json::Map 从字母序变成插入序。
# 要它是因为改用户配置文件时「只碰 hooks 子树」必须连带保住人家原来的键序，
# 字母序会把别人的 MCP / 权限 / 插件开关那堆键整体重排一遍。
serde_json = { version = "1", features = ["preserve_order"] }
btleplug = "0.11"
futures = "0.3"
notify = "8"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync", "time"] }
encoding_rs = "0.8"

# 全屏检测用的 Win32 调用。版本与依赖树里已有的 windows 0.62 对齐（btleplug/tauri 带的），
# 不额外引入一份 windows crate。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

# 打包体积优化，见 https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
